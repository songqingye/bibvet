[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bibvet"
version = "0.1.0"
description = "Vet your bibliography: verify DOIs and BibTeX / plain-text reference lists against Crossref and OpenAlex."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Song Qingye" }]
keywords = ["bibliography", "bibtex", "doi", "crossref", "openalex", "reference-checker", "academic-writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/songqingye/bibvet"

[project.scripts]
bibvet = "bibvet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
